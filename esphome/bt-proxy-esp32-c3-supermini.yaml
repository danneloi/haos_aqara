# ESPHome Bluetooth Proxy config -- ESP32-C3 "Super Mini" board.
#
# Notes specific to this board:
#   - The C3 Super Mini has a USB-C port wired directly to the chip's native
#     USB-Serial/JTAG -- for the very first flash, hold the BOOT button while
#     plugging it in (or while starting the flash) if it isn't detected.
#   - The esp-idf framework is effectively required here: the C3 is a
#     single-core RISC-V chip and the arduino-esp32 BLE stack does not support
#     it reliably. Always use esp-idf on C3 for Bluetooth proxy duty.
#   - The C3 Super Mini only exposes a handful of GPIOs and has no built-in
#     antenna amplifier -- expect somewhat shorter BLE range than a full-size
#     ESP32 dev board. Fine for a lock a few meters away; for longer range,
#     prefer the classic ESP32 or an ESP32-S3 board instead.
#
# Before flashing:
#   1. Fill in your Wi-Fi credentials below (or better: use secrets.yaml, see
#      https://esphome.io/guides/faq.html#tips-for-secrets-yaml).
#   2. Generate a fresh API encryption key: run `esphome wizard` once, or
#      generate 32 random bytes and base64-encode them yourself, and paste the
#      result in place of the placeholder below. Never reuse the example key.
#   3. Pick your own OTA password, replacing the placeholder.

esphome:
  name: bt-proxy-esp32-c3
  friendly_name: "BT Proxy ESP32-C3 Super Mini"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf   # required on C3 for a stable Bluetooth proxy

logger:

api:
  encryption:
    key: "REPLACE_ME_WITH_YOUR_OWN_BASE64_API_KEY=="

ota:
  - platform: esphome
    password: "replace_me_with_your_own_ota_password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Bt-Proxy-C3 Fallback Hotspot"
    password: "replace_me_with_your_own_fallback_password"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
